name: ROCm XLA Archive

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.rocm
      - mix.lock
      - scripts/rocm-xla-image
      - .github/workflows/rocm-xla-archive.yml
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: rocm-xla-archive
  cancel-in-progress: false

jobs:
  build-rocm-xla-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive the immutable ROCm XLA archive tag
        id: archive-image
        run: echo "archive_image=$(scripts/rocm-xla-image)" >> "${GITHUB_OUTPUT}"

      - name: Free disk space for the ROCm XLA build
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the immutable ROCm XLA archive exists
        id: archive
        env:
          XLA_ARCHIVE_IMAGE: ${{ steps.archive-image.outputs.archive_image }}
        run: |
          if docker buildx imagetools inspect "${XLA_ARCHIVE_IMAGE}" >/dev/null 2>&1; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish the ROCm XLA archive
        if: steps.archive.outputs.present != 'true'
        env:
          XLA_ARCHIVE_IMAGE: ${{ steps.archive-image.outputs.archive_image }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target xla-archive \
            --cache-from type=gha,scope=rocm-xla-archive \
            --cache-to type=gha,mode=max,scope=rocm-xla-archive \
            --tag "${XLA_ARCHIVE_IMAGE}" \
            --push \
            -f Dockerfile.rocm \
            .

      - name: Build the AMD application image with the archive
        env:
          XLA_ARCHIVE_IMAGE: ${{ steps.archive-image.outputs.archive_image }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=engine-amd \
            --cache-to type=gha,mode=max,scope=engine-amd \
            --build-arg XLA_ARCHIVE_IMAGE="${XLA_ARCHIVE_IMAGE}" \
            -f Dockerfile.rocm \
            .
