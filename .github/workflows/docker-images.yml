name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: docker-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: engine
            build_command: docker compose build engine
          - service: engine-nvidia
            build_command: docker buildx build --platform linux/amd64 --build-arg BUILDER_BASE=hexpm/elixir:1.19.5-erlang-28.3.1-ubuntu-noble-20260410 --build-arg XLA_TARGET=cuda12 --build-arg RUNTIME_BASE=nvidia/cuda:12.9.1-devel-ubuntu24.04 -f Dockerfile .
          - service: engine-match
            build_command: docker compose build engine-match
    name: build-${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free disk space for NVIDIA build
        if: matrix.service == 'engine-nvidia'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Build Docker image
        run: ${{ matrix.build_command }}
