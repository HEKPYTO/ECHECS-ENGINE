name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: docker-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-rocm-inputs:
    runs-on: ubuntu-latest
    outputs:
      rocm_inputs: ${{ steps.filter.outputs.rocm_inputs }}
      archive_image: ${{ steps.archive-image.outputs.archive_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect ROCm archive inputs
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rocm_inputs:
              - Dockerfile.rocm
              - mix.lock
              - scripts/rocm-xla-image
              - .github/workflows/rocm-xla-archive.yml

      - name: Derive the immutable ROCm XLA archive tag
        id: archive-image
        run: echo "archive_image=$(scripts/rocm-xla-image)" >> "${GITHUB_OUTPUT}"

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: engine
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine --cache-to type=gha,mode=max,scope=engine -f Dockerfile .
          - service: engine-nvidia
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine-nvidia --cache-to type=gha,mode=max,scope=engine-nvidia --build-arg BUILDER_BASE=hexpm/elixir:1.19.5-erlang-28.3.1-ubuntu-noble-20260410 --build-arg XLA_TARGET=cuda12 --build-arg RUNTIME_BASE=nvidia/cuda:12.9.1-devel-ubuntu24.04 -f Dockerfile .
          - service: engine-match
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine-match --cache-to type=gha,mode=max,scope=engine-match -f Dockerfile.match .

    name: build-${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free disk space for large builds
        if: matrix.service == 'engine-nvidia'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Build Docker image
        run: ${{ matrix.build_command }}

  build-amd:
    needs: detect-rocm-inputs
    if: ${{ needs.detect-rocm-inputs.outputs.rocm_inputs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for the ROCm XLA archive
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space for the AMD build
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Build AMD Docker image
        run: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine-amd --cache-to type=gha,mode=max,scope=engine-amd --build-arg BUILDER_BASE=hexpm/elixir:1.19.5-erlang-28.3.1-ubuntu-noble-20260410 --build-arg XLA_TARGET=rocm --build-arg XLA_ARCHIVE_IMAGE="${{ needs.detect-rocm-inputs.outputs.archive_image }}" --build-arg RUNTIME_BASE=rocm/dev-ubuntu-24.04:7.2.4-complete -f Dockerfile.rocm .
