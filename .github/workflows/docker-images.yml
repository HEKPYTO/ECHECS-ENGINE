name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: engine
            image: ghcr.io/hekpyto/echecs-engine
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine --cache-to type=gha,mode=max,scope=engine -f Dockerfile .
          - service: engine-nvidia
            image: ghcr.io/hekpyto/echecs-engine-nvidia
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine-nvidia --cache-to type=gha,mode=max,scope=engine-nvidia --build-arg BUILDER_BASE=hexpm/elixir:1.19.5-erlang-28.3.1-ubuntu-noble-20260410 --build-arg XLA_TARGET=cuda12 --build-arg RUNTIME_BASE=nvidia/cuda:12.9.1-devel-ubuntu24.04 -f Dockerfile .
          - service: engine-match
            image: ghcr.io/hekpyto/echecs-engine-match
            build_command: docker buildx build --platform linux/amd64 --cache-from type=gha,scope=engine-match --cache-to type=gha,mode=max,scope=engine-match -f Dockerfile.match .

    name: build-${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space for large builds
        if: matrix.service == 'engine-nvidia'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Build Docker image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ${{ matrix.build_command }} \
              --push \
              --tag "${IMAGE}:latest" \
              --tag "${IMAGE}:sha-${{ github.sha }}"
          else
            ${{ matrix.build_command }}
          fi
