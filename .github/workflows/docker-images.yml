name: Docker Images

on:
  pull_request:
  push:
    branches:
      - main
      - pr/**

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU image
        run: docker compose build engine

      - name: Build NVIDIA image
        run: docker compose build engine-nvidia

      - name: Build match image
        run: docker compose build engine-match
